<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALFRED — Dashboard Fonctionnel</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2128;
    --border: #30363d;
    --text: #e6edf3;
    --text2: #8b949e;
    --accent: #2563eb;
    --accent2: #3b82f6;
    --green: #238636;
    --green2: #2ea043;
    --green3: #56d364;
    --orange: #d97706;
    --orange2: #f59e0b;
    --red: #da3633;
    --purple: #8b5cf6;
    --cyan: #06b6d4;
    --yellow: #eab308;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; min-height: 100vh; }

  /* ─── HEADER ─── */
  #header {
    background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  #header h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
  #header h1 span { color: var(--accent2); }
  .hdr-right { display: flex; gap: 10px; align-items: center; }
  .date-tag { color: var(--text2); font-size: 11px; background: var(--surface2); padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border); }

  /* ─── GLOBAL STATS ─── */
  #global-stats {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .stat-card {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; text-align: center;
  }
  .stat-val { font-size: 22px; font-weight: 700; }
  .stat-lbl { font-size: 10px; color: var(--text2); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
  .sv-total { color: var(--accent2); }
  .sv-done { color: var(--green3); }
  .sv-wip { color: var(--orange2); }
  .sv-todo { color: var(--text2); }
  .sv-pct { color: var(--purple); font-size: 20px; }

  /* ─── GLOBAL PROGRESS ─── */
  #global-progress {
    padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px;
  }
  .gp-label { font-size: 11px; color: var(--text2); white-space: nowrap; min-width: 120px; }
  .progress-outer { flex: 1; height: 10px; background: var(--surface2); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .progress-inner { height: 100%; border-radius: 10px; transition: width 0.4s ease; }
  .pg-done { background: linear-gradient(90deg, var(--green), var(--green3)); }
  .pg-wip  { background: var(--orange2); }

  /* ─── TOOLBAR ─── */
  #toolbar {
    padding: 10px 20px; display: flex; gap: 10px; align-items: center;
    background: var(--bg); border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .filter-btn {
    padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text2); cursor: pointer; font-size: 12px;
    transition: all 0.15s;
  }
  .filter-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
  #search-input {
    padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); font-size: 12px; width: 220px;
    outline: none;
  }
  #search-input:focus { border-color: var(--accent2); }
  .sep { width: 1px; height: 20px; background: var(--border); }
  #expand-all, #collapse-all {
    padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text2); cursor: pointer; font-size: 11px;
  }
  #expand-all:hover, #collapse-all:hover { color: var(--text); border-color: var(--text2); }
  #reset-btn {
    padding: 5px 12px; border-radius: 6px; border: 1px solid #5a1a1a;
    background: #2a0a0a; color: #f87171; cursor: pointer; font-size: 11px;
    margin-left: auto;
  }
  #reset-btn:hover { background: #3a1010; }

  /* ─── MAIN LAYOUT ─── */
  #main { display: flex; height: calc(100vh - 220px); overflow: hidden; }

  /* ─── SIDEBAR BLOCS ─── */
  #sidebar {
    width: 260px; min-width: 260px; overflow-y: auto; border-right: 1px solid var(--border);
    background: var(--surface);
  }
  .bloc-item {
    padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; transition: background 0.12s;
    position: relative;
  }
  .bloc-item:hover { background: var(--surface2); }
  .bloc-item.selected { background: var(--surface2); border-left: 3px solid var(--accent2); }
  .bloc-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .bloc-info { flex: 1; min-width: 0; }
  .bloc-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bloc-sub { font-size: 10px; color: var(--text2); }
  .bloc-pct-badge {
    font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .mini-prog { height: 3px; background: var(--border); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .mini-prog-inner { height: 100%; border-radius: 2px; }

  /* ─── DETAIL PANEL ─── */
  #detail { flex: 1; overflow-y: auto; padding: 16px 20px; }
  #detail-header {
    display: flex; align-items: center; gap: 14px; margin-bottom: 16px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  #detail-icon { font-size: 28px; }
  #detail-title { font-size: 18px; font-weight: 700; }
  #detail-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .detail-stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .ds-chip {
    padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
    border: 1px solid; display: flex; align-items: center; gap: 5px;
  }
  .ds-chip.done { color: var(--green3); border-color: var(--green); background: #0d2818; }
  .ds-chip.wip  { color: var(--orange2); border-color: var(--orange); background: #1f1509; }
  .ds-chip.todo { color: var(--text2); border-color: var(--border); background: var(--surface2); }

  /* Fonction group */
  .fn-group {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 10px; overflow: hidden;
  }
  .fn-header {
    padding: 10px 14px; display: flex; align-items: center; gap: 10px;
    cursor: pointer; transition: background 0.12s; user-select: none;
  }
  .fn-header:hover { background: var(--surface2); }
  .fn-code { font-size: 11px; font-family: monospace; color: var(--accent2); background: rgba(37,99,235,0.12); padding: 2px 7px; border-radius: 4px; }
  .fn-label { font-size: 13px; font-weight: 600; flex: 1; }
  .fn-progress { display: flex; align-items: center; gap: 8px; }
  .fn-prog-bar { width: 80px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .fn-prog-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
  .fn-pct { font-size: 10px; color: var(--text2); width: 28px; text-align: right; }
  .fn-chevron { color: var(--text2); font-size: 10px; transition: transform 0.2s; }
  .fn-header.open .fn-chevron { transform: rotate(90deg); }

  /* Sous-fonctions */
  .subfn-list { border-top: 1px solid var(--border); display: none; }
  .subfn-list.open { display: block; }
  .subfn-row {
    padding: 8px 14px 8px 42px; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--border); transition: background 0.1s;
  }
  .subfn-row:last-child { border-bottom: none; }
  .subfn-row:hover { background: rgba(255,255,255,0.02); }
  .subfn-code { font-family: monospace; font-size: 10px; color: var(--text2); min-width: 56px; }
  .subfn-name { flex: 1; font-size: 12px; }
  .subfn-name.done-txt { text-decoration: line-through; color: var(--text2); }

  /* Status toggle */
  .status-btn {
    padding: 3px 9px; border-radius: 20px; border: 1px solid; font-size: 10px;
    font-weight: 600; cursor: pointer; transition: all 0.15s; white-space: nowrap;
    background: transparent;
  }
  .status-btn.todo  { color: var(--text2); border-color: var(--border); }
  .status-btn.todo:hover  { border-color: var(--orange); color: var(--orange2); }
  .status-btn.wip   { color: var(--orange2); border-color: var(--orange); background: #1f1509; }
  .status-btn.wip:hover   { border-color: var(--green); color: var(--green3); }
  .status-btn.done  { color: var(--green3); border-color: var(--green); background: #0d2818; }
  .status-btn.done:hover  { border-color: var(--border); color: var(--text2); background: transparent; }

  .note-input {
    background: transparent; border: none; border-bottom: 1px dashed var(--border);
    color: var(--text2); font-size: 10px; width: 130px; outline: none; padding: 1px 3px;
  }
  .note-input:focus { border-color: var(--accent2); color: var(--text); }
  .note-input::placeholder { color: #4a5568; }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text2); }

  /* Empty state */
  #empty-state { text-align: center; padding: 60px 20px; color: var(--text2); }
  #empty-state .es-icon { font-size: 40px; margin-bottom: 12px; }

  /* Toast */
  #toast {
    position: fixed; bottom: 20px; right: 20px; background: var(--surface2);
    border: 1px solid var(--green); color: var(--green3); padding: 8px 16px;
    border-radius: 8px; font-size: 12px; opacity: 0; transition: opacity 0.3s;
    pointer-events: none; z-index: 999;
  }
  #toast.show { opacity: 1; }

  /* Search highlight */
  .hl { background: rgba(234,179,8,0.25); border-radius: 2px; color: var(--yellow); }
</style>
</head>

</div>

<div id="global-progress">

</div>

<div id="toolbar">

  <div class="sep"></div>

  <button class="filter-btn" data-filter="done" onclick="setFilter('done',this)">✅ Terminés</button>
  <button class="filter-btn" data-filter="wip"  onclick="setFilter('wip',this)">🔄 En cours</button>
  <button class="filter-btn" data-filter="todo" onclick="setFilter('todo',this)">⬜ À faire</button>
  <div class="sep"></div>
  <button id="expand-all" onclick="toggleAllFn(true)">▼ Tout ouvrir</button>
  <button id="collapse-all" onclick="toggleAllFn(false)">▶ Tout fermer</button>
  <button id="reset-btn" onclick="confirmReset()">🗑 Réinitialiser</button>
</div>

<div id="main">
  <div id="sidebar"></div>
  <div id="detail">
    <div id="empty-state">
      <div class="es-icon">🗂️</div>

// ══════════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════════
// state[x_yy_zzz] = { status: 'todo'|'wip'|'done', note: '' }
let state = {};
let selectedBloc = null;
let currentFilter = 'all';
let searchQuery = '';
const STORAGE_KEY = 'alfred_dashboard_v2';

// ── Storage helpers ──────────────────────────────────────────────
async function saveState() {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify({ state, ts: new Date().toISOString() }));
    showToast('Sauvegardé ✓');
    updateLastSave(new Date());
  } catch(e) {
    console.warn('Storage save failed', e);
  }
}
async function loadState() {
  try {
    const r = await window.storage.get(STORAGE_KEY);
    if (r && r.value) {
      const d = JSON.parse(r.value);
      state = d.state || {};
      if (d.ts) updateLastSave(new Date(d.ts));
    }
  } catch(e) { state = {}; }
}
function updateLastSave(dt) {
  const el = document.getElementById('last-save');
  if (!dt) return;
  const h = dt.getHours().toString().padStart(2,'0');
  const m = dt.getMinutes().toString().padStart(2,'0');
  el.textContent = `Dernière sauvegarde : ${h}:${m}`;
}

// ── Key builder ──────────────────────────────────────────────────
function subKey(fnId, idx) { return `${fnId.replace('.','_')}_${String(idx+1).padStart(3,'0')}`; }

function getStatus(key) { return (state[key] && state[key].status) || 'todo'; }
function getNote(key)   { return (state[key] && state[key].note)   || ''; }

function cycleStatus(key) {
  const s = getStatus(key);
  const next = s === 'todo' ? 'wip' : s === 'wip' ? 'done' : 'todo';
  if (!state[key]) state[key] = {};
  state[key].status = next;
  saveState();
  return next;
}
function setNote(key, val) {
  if (!state[key]) state[key] = {};
  state[key].note = val;
  saveState();
}

// ══════════════════════════════════════════════════════════════════
// STATS
// ══════════════════════════════════════════════════════════════════
function computeStats() {
  let done=0, wip=0, todo=0, activeBlocs=0;
  for (const bloc of BLOCS) {
    let blocHasActivity = false;
    for (const fn of bloc.fns) {
      for (let i=0;i<fn.subs.length;i++) {
        const k = subKey(fn.id, i);
        const s = getStatus(k);
        if (s==='done') { done++; blocHasActivity=true; }
        else if (s==='wip') { wip++; blocHasActivity=true; }
        else todo++;
      }
    }
    if (blocHasActivity) activeBlocs++;
  }
  return { done, wip, todo, total:500, activeBlocs };
}

function computeBlocStats(bloc) {
  let done=0, wip=0, todo=0;
  for (const fn of bloc.fns) {
    for (let i=0;i<fn.subs.length;i++) {
      const s = getStatus(subKey(fn.id,i));
      if (s==='done') done++;
      else if (s==='wip') wip++;
      else todo++;
    }
  }
  return { done, wip, todo, total:25 };
}

function computeFnStats(fn) {
  let done=0, wip=0;
  for (let i=0;i<5;i++) {
    const s = getStatus(subKey(fn.id,i));
    if (s==='done') done++;
    else if (s==='wip') wip++;
  }
  return { done, wip };
}

function updateGlobalStats() {
  const s = computeStats();
  document.getElementById('gs-done').textContent = s.done;
  document.getElementById('gs-wip').textContent  = s.wip;
  document.getElementById('gs-todo').textContent = s.todo;
  document.getElementById('gs-pct').textContent  = Math.round((s.done/500)*100) + '%';
  document.getElementById('gs-blocs').textContent = s.activeBlocs + '/20';

  const donePct = (s.done/500)*100;
  const wipPct  = (s.wip/500)*100;
  document.getElementById('gp-done').style.width = donePct + '%';
  document.getElementById('gp-wip').style.width  = wipPct  + '%';
  document.getElementById('gp-text-done').textContent = s.done + ' done';
  document.getElementById('gp-text-wip').textContent  = s.wip  + ' wip';
}

// ══════════════════════════════════════════════════════════════════
// SIDEBAR
// ══════════════════════════════════════════════════════════════════
function renderSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  for (const bloc of BLOCS) {
    const s = computeBlocStats(bloc);
    const pct = Math.round((s.done/25)*100);
    const col = pct===100 ? '#22c55e' : s.wip+s.done>0 ? '#f59e0b' : '#4a5568';
    const div = document.createElement('div');
    div.className = 'bloc-item' + (selectedBloc===bloc.id?' selected':'');
    div.dataset.id = bloc.id;
    div.innerHTML = `
      <div class="bloc-dot" style="background:${bloc.color}"></div>
      <div class="bloc-info">
        <div class="bloc-name">${bloc.emoji} ${bloc.id}. ${bloc.name}</div>
        <div class="bloc-sub">${s.done} done · ${s.wip} wip · ${s.todo} todo</div>
        <div class="mini-prog"><div class="mini-prog-inner" style="width:${pct}%;background:${col}"></div></div>
      </div>
      <div class="bloc-pct-badge" style="color:${col}">${pct}%</div>
    `;
    div.onclick = () => selectBloc(bloc.id);
    sb.appendChild(div);
  }
}

// ══════════════════════════════════════════════════════════════════
// DETAIL
// ══════════════════════════════════════════════════════════════════
function selectBloc(id) {
  selectedBloc = id;
  renderSidebar();
  renderDetail();
}

function renderDetail() {
  const panel = document.getElementById('detail');
  if (!selectedBloc) { panel.innerHTML = '<div id="empty-state"><div class="es-icon">🗂️</div><div>Sélectionnez un bloc</div></div>'; return; }
  const bloc = BLOCS.find(b=>b.id===selectedBloc);
  if (!bloc) return;
  const s = computeBlocStats(bloc);
  const pct = Math.round((s.done/25)*100);
  const q = searchQuery.toLowerCase();

  let html = `
    <div id="detail-header">
      <div id="detail-icon">${bloc.emoji}</div>
      <div>
        <div id="detail-title">BLOC ${bloc.id} — ${bloc.name}</div>
        <div id="detail-sub">25 sous-fonctions · ${s.done} terminées · ${s.wip} en cours · avancement ${pct}%</div>
      </div>
    </div>
    <div class="detail-stats">
      <div class="ds-chip done">✅ ${s.done} terminées</div>
      <div class="ds-chip wip">🔄 ${s.wip} en cours</div>
      <div class="ds-chip todo">⬜ ${s.todo} à faire</div>
    </div>
  `;

  for (const fn of bloc.fns) {
    const fs = computeFnStats(fn);
    const fpct = Math.round(((fs.done)/5)*100);
    const fcol = fpct===100?'#22c55e':fs.wip+fs.done>0?'#f59e0b':'#4a5568';

    // Filtre : est-ce que cette fn a des sous-items correspondant au filtre/search ?
    let visibleSubs = fn.subs.map((name,i) => {
      const k = subKey(fn.id, i);
      const st = getStatus(k);
      const matchFilter = currentFilter==='all' || st===currentFilter;
      const matchSearch = !q || name.toLowerCase().includes(q) || fn.name.toLowerCase().includes(q) || fn.id.includes(q);
      return { name, i, k, st, visible: matchFilter && matchSearch };
    });
    const hasVisible = visibleSubs.some(s=>s.visible);
    if (!hasVisible) continue;

    const zzz = `${fn.id.replace('.','_')}`;
    html += `
      <div class="fn-group">
        <div class="fn-header" id="fnhdr-${zzz}" onclick="toggleFn('${zzz}')">
          <div class="fn-code">${fn.id}</div>
          <div class="fn-label">${fn.name}</div>
          <div class="fn-progress">
            <div class="fn-prog-bar"><div class="fn-prog-fill" style="width:${fpct}%;background:${fcol}"></div></div>
            <div class="fn-pct" style="color:${fcol}">${fpct}%</div>
          </div>
          <div class="fn-chevron">▶</div>
        </div>
        <div class="subfn-list" id="fnlist-${zzz}">
    `;
    for (const sub of visibleSubs) {
      if (!sub.visible) continue;
      const zzzCode = `${fn.id}.${String(sub.i+1).padStart(3,'0')}`;
      let nameHtml = sub.name;
      if (q && sub.name.toLowerCase().includes(q)) {
        const idx = sub.name.toLowerCase().indexOf(q);
        nameHtml = sub.name.slice(0,idx)+'<span class="hl">'+sub.name.slice(idx,idx+q.length)+'</span>'+sub.name.slice(idx+q.length);
      }
      const noteVal = getNote(sub.k).replace(/"/g,'&quot;');
      html += `
        <div class="subfn-row" id="row-${sub.k}">
          <div class="subfn-code">${zzzCode}</div>
          <div class="subfn-name ${sub.st==='done'?'done-txt':''}" id="sname-${sub.k}">${nameHtml}</div>
          <input class="note-input" placeholder="note…" value="${noteVal}"
            onchange="setNote('${sub.k}', this.value)"
            onblur="setNote('${sub.k}', this.value)">
          <button class="status-btn ${sub.st}" id="sbtn-${sub.k}" onclick="handleStatusClick('${sub.k}','${fn.id}')">${statusLabel(sub.st)}</button>
        </div>
      `;
    }
    html += `</div></div>`;
  }
  panel.innerHTML = html;
}

function statusLabel(s) {
  return s==='done'?'✅ Terminé':s==='wip'?'🔄 En cours':'⬜ À faire';
}

function handleStatusClick(key, fnId) {
  const next = cycleStatus(key);
  // MAJ bouton
  const btn = document.getElementById('sbtn-'+key);
  if (btn) { btn.className='status-btn '+next; btn.textContent=statusLabel(next); }
  // MAJ nom (strikethrough)
  const nm = document.getElementById('sname-'+key);
  if (nm) { nm.className='subfn-name '+(next==='done'?'done-txt':''); }
  // MAJ stats globales + sidebar
  updateGlobalStats();
  renderSidebar();
  // MAJ barre de la fonction
  const fn = BLOCS.flatMap(b=>b.fns).find(f=>f.id===fnId);
  if (fn) {
    const fs = computeFnStats(fn);
    const fpct = Math.round((fs.done/5)*100);
    const fcol = fpct===100?'#22c55e':fs.wip+fs.done>0?'#f59e0b':'#4a5568';
    const zzz = fnId.replace('.','_');
    const fill = document.querySelector(`#fnlist-${zzz}`)?.previousElementSibling?.querySelector('.fn-prog-fill');
    const pctEl = document.querySelector(`#fnlist-${zzz}`)?.previousElementSibling?.querySelector('.fn-pct');
    if (fill) { fill.style.width=fpct+'%'; fill.style.background=fcol; }
    if (pctEl) { pctEl.textContent=fpct+'%'; pctEl.style.color=fcol; }
  }
}

function toggleFn(id) {
  const hdr = document.getElementById('fnhdr-'+id);
  const lst = document.getElementById('fnlist-'+id);
  if (!lst) return;
  const open = lst.classList.contains('open');
  lst.classList.toggle('open', !open);
  if (hdr) hdr.classList.toggle('open', !open);
}

function toggleAllFn(open) {
  document.querySelectorAll('.subfn-list').forEach(el=>{
    el.classList.toggle('open',open);
    const hdr = el.previousElementSibling;
    if (hdr) hdr.classList.toggle('open',open);
  });
}

// ══════════════════════════════════════════════════════════════════
// FILTERS & SEARCH
// ══════════════════════════════════════════════════════════════════
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if (selectedBloc) renderDetail();
}

function applySearch() {
  searchQuery = document.getElementById('search-input').value.trim();
  // Si recherche active, chercher dans tous les blocs
  if (searchQuery) {
    // Trouver le premier bloc avec un résultat
    const q = searchQuery.toLowerCase();
    for (const bloc of BLOCS) {
      for (const fn of bloc.fns) {
        for (const sub of fn.subs) {
          if (sub.toLowerCase().includes(q) || fn.name.toLowerCase().includes(q)) {
            selectBloc(bloc.id);
            return;
          }
        }
      }
    }
  }
  if (selectedBloc) renderDetail();
}

// ══════════════════════════════════════════════════════════════════
// RESET
// ══════════════════════════════════════════════════════════════════
function confirmReset() {
  if (!confirm('Réinitialiser TOUT l\'avancement ? Cette action est irréversible.')) return;
  state = {};
  saveState();
  updateGlobalStats();
  renderSidebar();
  if (selectedBloc) renderDetail();
}

// ══════════════════════════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════════════════════════
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

// ══════════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════════
async function init() {
  await loadState();
  updateGlobalStats();
  renderSidebar();
  // Sélectionner le premier bloc par défaut
  selectBloc(1);
}
init();
