<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALFRED — Dashboard</title>
    <style>
        /* LECON CSS : couleurs, polices, mise en page */
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #6c63ff; text-align: center; }
        .carte {
            background: #16213e;
            border: 1px solid #6c63ff;
            border-radius: 8px;
            padding: 20px;
            margin: 10px;
            display: inline-block;
            width: 200px;
            text-align: center;
        }
        .btn {
            background: #6c63ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- LECON HTML : balises de structure -->
    <h1>ALFRED — Assistant Web</h1>
    <p style="text-align:center;">Semaine 1 — Apprentissage HTML</p>

    <!-- LECON : div, class, id -->
    <div style="text-align:center; margin: 30px;">

        <!-- Cartes de modules -->
        <div class="carte">
            <h3>Python</h3>
            <p>Scripts et automatisation</p>
        </div>

        <div class="carte">
            <h3>SQL</h3>
            <p>Base de donnees</p>
        </div>

        <div class="carte">
            <h3>Java</h3>
            <p>Programmation objet</p>
        </div>

        <div class="carte">
            <h3>PHP</h3>
            <p>API et backend web</p>
        </div>

    </div>

    <!-- LECON : formulaire HTML -->
    <div style="text-align:center; margin-top: 30px;">
        <h2>Connexion ALFRED</h2>
        <form action="backend/login.php" method="POST">
            <input type="text" name="nom" placeholder="Votre nom" style="padding:8px; margin:5px;"><br>
            <input type="email" name="email" placeholder="Votre email" style="padding:8px; margin:5px;"><br>
            <button type="submit" class="btn">Se connecter</button>
        </form>
    </div>

    <!-- LECON : JavaScript basique -->
    <script>
        // JavaScript : afficher un message de bienvenue
        console.log("ALFRED Web - Semaine 1 - HTML charge avec succes");
        document.title = "ALFRED — " + new Date().toLocaleDateString("fr-FR");
    </script>

</body>
</html>
