[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "alfred"
version = "1.0.0"
description = "Assistant Cognitif Adaptatif - Local First"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Tests exclus du CI : hardware audio (sounddevice), imports ancienne arborescence, tests LLM (module-level)
addopts = """
  --ignore=tests/test_micro.py
  --ignore=tests/test_stt.py
  --ignore=tests/test_tts_engine.py
  --ignore=tests/test_tts_piper_status.py
  --ignore=tests/test_voice_loop.py
  --ignore=tests/test_pipeline.py
  --ignore=tests/test_pipeline_llm.py
  --ignore=tests/test_b01_speech.py
  --ignore=tests/test_tts_piper.py
"""
