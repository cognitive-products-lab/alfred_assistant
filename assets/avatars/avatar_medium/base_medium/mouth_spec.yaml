mouth_layer:
  status: LOCKED
  version: 1.0

  canvas:
    width: 1024
    height: 1536
    format: PNG
    mode: RGBA
    background: transparent

  bbox:
    x_min: 470
    x_max: 580
    y_min: 262
    y_max: 325
    width: 110
    height: 63
    center_x: 525
    center_y: 293

  anchor:
    x: 525
    y: 293

  style:
    type: anime_male
    outline_color: "#2A1F1A"
    line_weight: thin
    symmetry: centered
    realism: anime

  transparency:
    skin: forbidden
    face: forbidden
    teeth: allowed_if_specified
    tongue: allowed_if_specified
    shadows: forbidden
    glow: forbidden
    alpha_outside_mouth: 0

  colors:
    lip_outline: "#2A1F1A"
    mouth_interior: "#4A1C1C"
    tongue: "#D97B87"
    teeth: "#FFFFFF"

  mouth_base:
    width: 60
    height: 8

  reference:
    body_asset: avatar_medium_no_face.png
    mouth_line_y: 293

  lipsync:
    compatible_with:
      - Piper
      - XTTS
    phonemes:
      - A
      - E
      - I
      - O
      - U
      - M

  variants:
    # --- Phonemes (7) ---
    mouth_closed:
      opening: 0%
      lips_visible: true
      teeth_visible: false
      tongue_visible: false
    mouth_m:
      opening: 0%
      lips_pressed: true
      teeth_visible: false
      tongue_visible: false
    mouth_a:
      opening_vertical: 100%
      opening_horizontal: 60%
      teeth_visible: true
      tongue_visible: true
    mouth_e:
      opening_vertical: 60%
      opening_horizontal: 90%
      teeth_visible: true
      tongue_visible: false
    mouth_i:
      opening_vertical: 40%
      opening_horizontal: 100%
      shape: stretched
      teeth_visible: true
      tongue_visible: false
    mouth_o:
      opening_vertical: 100%
      opening_horizontal: 45%
      shape: round
      teeth_visible: true
      tongue_visible: false
    mouth_u:
      opening_vertical: 70%
      opening_horizontal: 35%
      shape: rounded
      teeth_visible: false
      tongue_visible: false

    # --- Expressions (4) ---
    mouth_smile:
      corners: raised
      teeth_visible: false
    mouth_big_smile:
      corners: raised
      teeth_visible: true
    mouth_concerned:
      corners: lowered
      opening: slight
    mouth_surprised:
      shape: round
      opening: medium

  variant_count: 11
